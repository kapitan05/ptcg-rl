# C/03 (Sprint 3 control): continue each C/01 seed's final policy for 6 more cycles with the
# repo-default opponents. The control arm for C/04/C/05 (same start, games, seeds, early stop).
# runs/C01_s{seed} links to C/01 s0/s1 and C/01b s2 (see experiments/C/README.md).
extends: ../../base/full.yaml
name: ppo_continue
owner: C
question: ppo_opponent_pool
hypothesis: >-
  Control: more cycles vs. the default pool (4 rule bots + GBDT + self). Expect small further
  gains on rating_v1 and no gain on the held-out pool.
seeds: [0, 1, 2]
resources: {cpus: 32, mem: 160G, time: "23:00:00", gpus: 1}
stages:
  ppo:
    checkpoint: runs/C01_s{seed}/ppo/cycle-011/models/model.pt
    canary: runs/A-distill_ppo_smoke-s{seed}-1b8102e5/distill/canary.npz
    gbdt_model: outputs/mega_lucario/scale/runs/games_1600_s0/model/model.gbdt
    cycles: 6
    games: 5000
    updates: 128
    workers: 32
    device: cuda
    kl_early_stop: 2.0
    eval_cycles: [2]
  eval:
    games_per_pair: 200
    workers: 32
    extra:
      c01_final: runs/C01_s{seed}/ppo/cycle-011/models/model.bin
      start_transformer: runs/A-distill_ppo_smoke-s{seed}-1b8102e5/distill/model/model.bin
      gbdt_1600_s0: outputs/mega_lucario/scale/runs/games_1600_s0/model/model.gbdt
      heldout_dragapult_gbdt: outputs/dragapult/heldout/model/model.gbdt
      heldout_iono_gbdt: outputs/iono/heldout/model/model.gbdt
      heldout_abomasnow_gbdt: outputs/mega_abomasnow/heldout/model/model.gbdt
