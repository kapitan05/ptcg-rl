# A/02: distil the best GBDT into the Transformer (GPU), validate, then one small PPO cycle.
extends: ../../base/full.yaml
name: distill_ppo_smoke
owner: A
question: pipeline
hypothesis: The distilled Transformer matches its GBDT teacher; one PPO cycle passes all health checks.
seeds: [0]
resources: {cpus: 32, mem: 128G, time: "23:00:00", gpus: 1}
stages:
  distill: {teacher_model: models/scale/best.gbdt, teacher_games_per_opponent: 1250, device: cuda}
  ppo: {gbdt_model: models/scale/best.gbdt, cycles: 1, games: 200, updates: 4, workers: 16, device: cuda}
  eval: {games_per_pair: 200, workers: 32}
